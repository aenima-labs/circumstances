[project]
name = "circumstances"
dynamic = ["version", "readme"]
description = "Open-source situational testing framework for AI agents"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Ænima Labs", email = "hello@aenimalabs.com" }]
keywords = ["agents", "evaluation", "testing", "safety", "situational-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://circumstances.aenimalabs.com/"
Documentation = "https://circumstances.aenimalabs.com/"
Source = "https://github.com/aenima-labs/circumstances"
Issues = "https://github.com/aenima-labs/circumstances/issues"
Changelog = "https://github.com/aenima-labs/circumstances/releases"

[project.optional-dependencies]
http = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
circumstances = "circumstances.cli:main"
circs = "circumstances.cli:main"

[project.entry-points."circumstances.subjects"]
toy = "circumstances.adapters.toy:ToySubjectPlugin"
openai-compatible = "circumstances.adapters.openai_compatible:OpenAICompatibleSubjectPlugin"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/circumstances/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/circumstances"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/site", "/packaging"]

# PyPI renders README.md outside the repository, so relative links and images
# would break there. Point them at GitHub and drop the Mermaid diagram.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\n.*?```\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="\.github/'
replacement = '\1="https://raw.githubusercontent.com/aenima-labs/circumstances/main/.github/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?:|#)([^"]+)"'
replacement = 'href="https://github.com/aenima-labs/circumstances/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?:|#)([^)]+)\)'
replacement = '](https://github.com/aenima-labs/circumstances/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["circumstances"]

