name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands. Use the toy subject if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output or traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `circumstances --version`, and the commit if installed from git.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python and OS
      placeholder: Python 3.13, macOS 26
