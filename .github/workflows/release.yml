name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      # tests/test_packaging.py also checks that packaging/circs pins this version.
      - run: uv run pytest -q
      - name: Check the tag matches the package version
        run: |
          version="$(uv run python -c 'import circumstances; print(circumstances.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match circumstances $version"
            exit 1
          fi
      - run: uv build --out-dir dist
      - run: uv build packaging/circs --out-dir dist-circs
      - run: uvx twine check --strict dist/* dist-circs/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            dist-circs/
          if-no-files-found: error

  # PyPI trusted publishing: each project has its own publisher on pypi.org,
  # bound to this workflow and to the environment named below.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/circumstances/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Lets 'Re-run all jobs' finish after one of the two uploads succeeded.
          skip-existing: true

  # `circs` pins `circumstances==<version>`, so it goes up second.
  pypi-circs:
    needs: pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi-circs
      url: https://pypi.org/project/circs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-circs/
          # Lets 'Re-run all jobs' finish after one of the two uploads succeeded.
          skip-existing: true

  github-release:
    needs: pypi-circs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Checksums and SBOM stub
        run: |
          mkdir release
          cp dist/* dist-circs/* release/
          cd release
          shasum -a 256 *.whl *.tar.gz > SHA256SUMS
          {
            echo "SPDXVersion: SPDX-2.3"
            echo "DataLicense: CC0-1.0"
            echo "PackageName: circumstances"
            echo "PackageVersion: ${GITHUB_REF_NAME#v}"
            echo "PackageDownloadLocation: https://github.com/aenima-labs/circumstances"
            echo "FilesAnalyzed: false"
          } > circumstances.spdx
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*
            jsonschema/v4/*
          generate_release_notes: true
