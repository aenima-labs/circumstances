name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - name: Verify generated schemas
        run: |
          cp -R jsonschema/v4 /tmp/schemas
          uv run circumstances export-schema jsonschema/v4
          diff -ru /tmp/schemas jsonschema/v4

